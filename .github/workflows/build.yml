name: Build firmware
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO, esptool, Pillow
        run: pip install -q platformio esptool==4.5.1 pillow numpy
      - name: Unit tests (protocol, drag timer, GPS)
        run: |
          set -o pipefail
          mkdir -p out
          (g++ -std=c++17 -Iinclude -o proto_test test/proto_test.cpp && ./proto_test && \
           g++ -std=c++17 -Iinclude -o ride_test test/ride_test.cpp && ./ride_test) 2>&1 | tee out/TESTS.txt
      - name: Render screen previews (real UI code)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p out/screens
          python tools/render_screens.py 2>&1 | tee out/render.log
          cp assets/screens/*.png out/screens/
      - name: Build (CYD 3.5 + ESP32-S3 + S3 4.0")
        if: always()
        run: |
          set -o pipefail
          python tools/embed_web.py
          pio run -e cyd35 -e esp32-s3 -e s3-40 2>&1 | tee out/build.log
      - name: Make flash images
        run: |
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          B=.pio/build/cyd35
          python -m esptool --chip esp32 merge_bin -o out/VOLTOL_CYD35_INSTALL.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          cp $B/firmware.bin out/VOLTOL_CYD35_APP_UPDATE.bin
          S3=.pio/build/esp32-s3
          python -m esptool --chip esp32s3 merge_bin -o out/VOLTOL_S3_INSTALL.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 $S3/bootloader.bin 0x8000 $S3/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $S3/firmware.bin
          cp $S3/firmware.bin out/VOLTOL_S3_APP_UPDATE.bin
          S40=.pio/build/s3-40
          python -m esptool --chip esp32s3 merge_bin -o out/VOLTOL_S3_40_INSTALL.bin \
            --flash_mode keep --flash_freq 80m --flash_size 16MB \
            0x0 $S40/bootloader.bin 0x8000 $S40/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $S40/firmware.bin
          cp $S40/firmware.bin out/VOLTOL_S3_40_APP_UPDATE.bin
          cp "$BOOT_APP0" out/BOOT_APP0.bin
          grep -E "RAM:|Flash:" out/build.log > out/SIZES.txt || true
          (cd out && sha256sum *.bin > SHA256SUMS.txt)
          # version.json: read by the boards for internet updates
          VER=$(grep -oP '#define VOLTOL_FW "\K[^"]+' include/config.h)
          NOTE=$(git log -1 --pretty=%s | tr -d '"\\' | cut -c1-120)
          sz() { stat -c %s "out/$1"; }
          sh() { sha256sum "out/$1" | cut -d' ' -f1; }
          printf '{"version":"%s","notes":"%s","cyd35":{"file":"VOLTOL_CYD35_APP_UPDATE.bin","size":%s,"sha256":"%s"},"s3":{"file":"VOLTOL_S3_APP_UPDATE.bin","size":%s,"sha256":"%s"},"s340":{"file":"VOLTOL_S3_40_APP_UPDATE.bin","size":%s,"sha256":"%s"}}\n' \
            "$VER" "$NOTE" "$(sz VOLTOL_CYD35_APP_UPDATE.bin)" "$(sh VOLTOL_CYD35_APP_UPDATE.bin)" "$(sz VOLTOL_S3_APP_UPDATE.bin)" "$(sh VOLTOL_S3_APP_UPDATE.bin)" \
            "$(sz VOLTOL_S3_40_APP_UPDATE.bin)" "$(sh VOLTOL_S3_40_APP_UPDATE.bin)" > out/version.json
          cat out/version.json
      - name: Publish to firmware-build branch
        if: always()
        run: |
          git config user.name "voltol-ci"
          git config user.email "voltol-ci@users.noreply.github.com"
          BR=firmware-build; [ "${GITHUB_REF_NAME}" = main ] || BR=firmware-dev   # dev builds never reach boards' OTA
          git checkout --orphan $BR
          git read-tree --empty
          mkdir -p firmware/screens
          find out -maxdepth 1 -type f -exec cp {} firmware/ \;
          cp out/screens/*.png firmware/screens/ 2>/dev/null || true
          cp assets/screens/web_*.png firmware/screens/ 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA::7}" > firmware/STATUS.txt
          git add -f firmware/
          git commit -qm "firmware for ${GITHUB_SHA::7} (${{ job.status }})"
          git push -f origin $BR 2>&1 | tail -5
