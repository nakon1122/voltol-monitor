; VOTOL Monitor
[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
lib_deps =
  h2zero/NimBLE-Arduino@1.4.2
  bblanchon/ArduinoJson@6.21.5

; ESP32-3248S035 "Cheap Yellow Display" 3.5" (screen + web page)
[env:cyd35]
board = esp32dev
board_build.partitions = partitions.csv
lib_deps =
  h2zero/NimBLE-Arduino@1.4.2
  bblanchon/ArduinoJson@6.21.5
  lovyan03/LovyanGFX@1.1.16
build_flags = -std=gnu++17 -Os -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> -<headless_stub.cpp>

; ESP32-S3 DevKitC-1 (8 MB flash), no screen: web dashboard only
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_s3.csv
board_upload.flash_size = 8MB
build_flags = -std=gnu++17 -Os -DCORE_DEBUG_LEVEL=0 -DVOTOL_HEADLESS -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<display.cpp> -<ui.cpp> -<fonts_vlw.cpp>

; ESP32-S3 4.0" 480x320 IPS capacitive touch (LCDwiki ES3C40P, 16 MB flash, 8 MB PSRAM)
[env:s3-40]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions_s340.csv
board_upload.flash_size = 16MB
lib_deps =
  h2zero/NimBLE-Arduino@1.4.2
  bblanchon/ArduinoJson@6.21.5
  lovyan03/LovyanGFX@1.1.16
build_flags = -std=gnu++17 -Os -DCORE_DEBUG_LEVEL=0 -DVOTOL_S340 -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
build_src_filter = +<*> -<headless_stub.cpp>

; KSDIY ESP32-P4C5 4.3" MIPI (ST7102 + ST7123, AXP2101, Wi-Fi via ESP32-C5 / ESP-Hosted, ML307C 4G)
; Arduino 3 (pioarduino): stock P4 libs target silicon v3.x; ESP-Hosted SDIO pins 18/19/14-17 match the board.
; lib/ksdiy_* are fetched by CI from the ESP component registry (tools/fetch_p4_components.sh).
[env:p4c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-p4-evboard
board_build.partitions = partitions_p4c5.csv
board_upload.flash_size = 16MB
build_unflags =
build_flags = -Os -DCORE_DEBUG_LEVEL=0 -DCONFIG_ESP_LCD_TOUCH_MAX_POINTS=5 -DCONFIG_ESP_LCD_TOUCH_MAX_BUTTONS=1 -DVOTOL_P4C5 -DVOTOL_NO_BLE -DBOARD_HAS_PSRAM
build_src_filter = +<*> -<headless_stub.cpp>
extra_scripts = pre:tools/p4_incs.py
lib_ldf_mode = chain+
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  lovyan03/LovyanGFX@1.2.7
  ksdiy_st7102
  ksdiy_st7123
  ksdiy_axp2101
  ksdiy_lcd_touch
  FS
  LittleFS
  SD_MMC
