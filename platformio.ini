; VOLTOL Monitor
[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
lib_deps =
  h2zero/NimBLE-Arduino@1.4.2
  bblanchon/ArduinoJson@6.21.5

; ESP32-3248S035 "Cheap Yellow Display" 3.5" (screen + web page)
[env:cyd35]
board = esp32dev
board_build.partitions = partitions.csv
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  lovyan03/LovyanGFX@1.1.16
build_flags = -std=gnu++17 -Os -DCORE_DEBUG_LEVEL=0 -DVOLTOL_NO_BLE
build_src_filter = +<*> -<headless_stub.cpp>

; ESP32-S3 DevKitC-1 (8 MB flash), no screen: web dashboard only
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_s3.csv
board_upload.flash_size = 8MB
build_flags = -std=gnu++17 -Os -DCORE_DEBUG_LEVEL=0 -DVOLTOL_HEADLESS -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<display.cpp> -<ui.cpp> -<fonts_vlw.cpp>
